<link rel="stylesheet" href="../style.css">
<script src="../reader.js"></script>
<script src="login.js"></script>
<script src="../reader.js"></script>
<style>
    .form_con{
        text-align: center; 
        font-size: 30px; 
        padding-left: 20px; 
        padding-right: 20px; 
        position: absolute; 
        width: 50%;
    }
</style>

<html>
    <body class="bg_color" style="margin: 0px;" onload="add_listeners()">
        <div style="position: fixed; width: 100%; height: 100%; top: 0px; left: 0px;">
            <img src="../img/agristrive_bg.jpg" alt="" style="width: 100%; height: 100%; opacity: 20%;">
        </div>

        <div id="container_body" class="main_color main_body base_font" style="width: fit-content; height: 400px; padding: 20px;">
            <div style="width: 1000px; height: 100%; padding: 30px; display: inline-block;">
                <div class="form_con"style="left:0px; top: 0px" class="base_font">
                    <div style="font-size: 60px;">SIGN UP</div>
                    <hr style="border-color: #5b4f47;">
    
                    <form action="" id="signin_form"class="base_font" onkeydown="return event.key != 'Enter'" onsubmit="event.preventDefault();">
                        USERNAME <br>
                        <input type="text" name="login_user"class="base_font rename_input" style="height: 40px;" maxlength="20" minlength="3">
                        <br> PASSWORD <br>
                        <input type="password" name="login-password" class="base_font rename_input" style="height: 40px;"  maxlength="20" minlength="8">
                        <div id="user_use_label" style="height: 20px; color: red; font-size: 10px; visibility: hidden;">
                            *THE USERNAME IS ALREADY IN USE
                        </div>
                        <input type="submit" value="Create Account" class="rename_input_submission base_font" style="position: inherit; height: 40px;">
                    </form>
                </div>

                <div class="form_con"style="right: 0px; top: 0px" class="base_font">
                    <div style="font-size: 60px;">LOGIN</div>
                    <hr style="border-color: #5b4f47;">
    
                    <form action="" class="base_font"  id="login_form" onkeydown="return event.key != 'Enter'" onsubmit="event.preventDefault();">
                        USERNAME <br>
                        <input type="text" name="login_user"class="base_font rename_input" style="height: 40px;" maxlength="20" minlength="3">
                        <br> PASSWORD <br>
                        <input type="password" name="login-password" class="base_font rename_input" style="height: 40px;" maxlength="20" minlength="8">
                        <div id="log_in_error" style="height: 20px; color: red; font-size: 10px; visibility: hidden;">
                            *INVALID USERNAME OR PASSWORD; TRY AGAIN
                        </div>
                        <input type="submit" value="Log In" class="rename_input_submission base_font" style="position: inherit; height: 40px;">
                    </form>
                </div>
                
            </div>
        </div>

        <div class="main_color" style="width: 100%; height: 120px; position: fixed; top: 0px; border-bottom: solid; border-color: #5b4f47;">
            <img src="../img/agristrive_logo.png" alt="logo" style="width: 120px; height: 120px; position: absolute; top: 0px; left: 30px;">
            <div class="base_font" style="position: absolute; font-size: 30px; padding-left: 150px; padding-top: 22px;">
                <div style="height: fit-content; font-size: 40px;">Agristrive</div>
                <div style="font-size: 20px;">Strive for Quality, Harvest Excellence</div>
           </div>
            <div class="base_font" style="position: absolute; text-align: right; right: 0px; bottom: 0px; font-size: 25px; padding: 10px;">
                &nbsp &nbsp<a href="../" class="base_font" style="text-decoration: none">Home</a>
                &nbsp &nbsp<a href="../myfarm/myfarms" class="base_font" style="text-decoration: none">My Farms</a>
                &nbsp &nbsp<a href="../aboutus/aboutus" class="base_font" style="text-decoration: none">About Us</a>
                &nbsp &nbsp<a id="account_tab" href="../login/login" class="base_font" style="text-decoration: none">Login / Sign Up</a>
            </div>
        </div> 
    </body>
</html>
