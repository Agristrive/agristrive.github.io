<link rel="stylesheet" href="../style.css">
<script src="../reader.js"></script>
<script src="farm.js"></script>

<html>
    <title>Agristrive | Farm</title>
    <body class="bg_color" style="margin: 0px;" onload="size_change(null, 0, true); start_farm(); on_start()">
        <div style="position: fixed; width: 100%; height: 100%; top: 0px; left: 0px;">
            <img src="../img/agristrive_bg.jpg" alt="" style="width: 100%; height: 100%; opacity: 20%; pointer-events: none;">
       </div>
        <div id="container_body" class="main_color main_body" style="width: 1200px; height: 500px; min-height: 500px;">
            <div style="padding: 20px;"> 
                <header class="base_font" style="font-size: 30px;" id="farm_name_header">New Farm</header>

                <script src="../reader.js"></script>

                <hr style="border-color: #5b4f47;">
            </div>
            <div id="size_containers" style="height: 40px; width: 90%; margin-left: 40px; position: absolute; top: 80px;">
                <div id="width_container" style="display: inline-block;">
                    <button class=" size_change_buttons base_font" onclick="size_change('width', -1)">&lt</button>
                    <div id="width_text" class="size_change_buttons base_font" style="text-align: center; display:inline-block; background-color: whitesmoke;">5</div>
                    <button class="size_change_buttons base_font" onclick="size_change('width', 1)">&gt</button>
                </div>
                &nbsp&nbsp&nbsp&nbsp
                <div id="height_container"  style="display: inline-block;">
                    <button class="size_change_buttons base_font" onclick="size_change('height', -1)">&lt</button>
                    <div id="height_text" class="size_change_buttons base_font" style="text-align: center; display:inline-block; background-color: whitesmoke;">5</div>
                    <button class="size_change_buttons base_font" onclick="size_change('height', 1)">&gt</button>
                </div>
                &nbsp&nbsp&nbsp
                <button class="size_change_buttons base_font" id="saveButton" style="text-align: center; width: fit-content; background-color: white;" onclick="write_new_plots()"> SAVE PLOT</button>
                <div class="base_font"style="float: right;">
                    <button class="size_change_buttons base_font" id="addButton" style="text-align: center; width: fit-content; background-color: white;" onclick="doAdd()">ADD NEW</button>
                    &nbsp&nbsp&nbsp
                    <button class="size_change_buttons base_font" id="removeButton" style="text-align: center; width: 75px; background-color: white;" onclick="doRemove()">REMOVE</button>
                    &nbsp&nbsp&nbsp
                    <button class="size_change_buttons base_font" id="harvestButton" style="text-align: center; width: fit-content; background-color: white;" onclick="doHarvest()">HARVEST</button>
                    &nbsp&nbsp&nbsp
                    <button class="size_change_buttons base_font" id="waterButton" style="text-align: center; width: 75px; background-color: white;" onclick="doWater()">WATER</button>
                    &nbsp&nbsp&nbsp
                    Select Your Crop:&nbsp&nbsp
                    <select name="plant" id="plant-select">
                    </select>
                </div>
            </div>

            <div id="plot_container" style="width: 94%; height: 70%; position: relative; top: 20px; margin-left: auto; margin-right: auto;">
                
            </div>
        </div>

        <div id="show_loading" class="base_font" style="opacity: 50%;background-color:gray;display:block; color: rgb(0, 0, 0);
        position: fixed; margin-left: auto; height: 100%; width: 100%; font-size: 40px; top: 0px; text-align: center; line-height: 700px;">
            <div> LOADING CONTENT...</div>
        </div>

        <div class="main_color" style="width: 100%; height: 120px; position: fixed; top: 0px; border-bottom: solid; border-color: #5b4f47;">
            <img src="../img/agristrive_logo.png" alt="logo" style="width: 120px; height: 120px; position: absolute; top: 0px; left: 30px;">
            <div class="base_font" style="position: absolute; font-size: 30px; padding-left: 150px; padding-top: 22px;">
                <div style="height: fit-content; font-size: 40px;">Agristrive</div>
                <div style="font-size: 20px;">Strive for Quality, Harvest Excellence</div>
           </div>
            <div class="base_font" style="position: absolute; text-align: right; right: 0px; bottom: 0px; font-size: 25px; padding: 10px;">
                &nbsp &nbsp<a href="../" class="base_font" style="text-decoration: none">Home</a>
                &nbsp &nbsp<a href="../myfarm/myfarms" class="base_font" style="text-decoration: none">My Farms</a>
                &nbsp &nbsp<a href="../aboutus/aboutus" class="base_font" style="text-decoration: none">About Us</a>
                &nbsp &nbsp<a href="../login/login" id="account_tab" class="base_font" style="text-decoration: none">Login / Sign Up</a>

            </div>
        </div> 
        <img src="../img/packet.png" alt="" id="addIcon" style="width: 30px; height: 30px; position: fixed; display: none; pointer-events: none;">
        <img src="../img/trowel.png" alt="" id="removeIcon" style="width: 15px; height: 15px; position: fixed; display: none; pointer-events: none;">
        <img src="../img/watering_can.png" alt="" id="waterIcon" style="width: 30px; height: 20px; position: fixed; display: none; pointer-events: none;">
        <img src="../img/glove.png" alt="" id="harvestIcon" style="width: 30px; height: 30px; position: fixed; display: none; pointer-events: none;">
        <div id="plot_info"
         style="width: fit-content; height: fit-content; position: fixed; background-color: wheat; display: none;  pointer-events: none; border: solid 3px;
         border-radius: 8px; padding: 8px;">
            <div id="crop_name" style="font-size: 20px;">gadhadjhsajdhakjdhakjhdajhd</div>
            <hr style="border-color: black;">
            <div id="crop_info" style="font-size: 10px;">ajdandajkdnajkdnajdn</div>
        </div>

        <div id="selection" style="background-color: #5b4f47; opacity: 60%; position: fixed; pointer-events: none; border: solid black;"></div>
        
    </body> 
</html>
